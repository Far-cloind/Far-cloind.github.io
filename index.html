<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一张可互动的祝福贺卡">
  <title>一封给你的祝福</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&display=swap">
  <style>
    :root { --ink: #121735; --night: #1c2451; --paper: #fff9e9; --rose: #b83c5b; --gold: #d9ac51; --muted: #69708b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; color: var(--ink); background: #f3e5bd url("assets/xuan-paper-bg.png") center / cover fixed; font-family: "Noto Serif SC", serif; }
    .sky, .sky::before, .sky::after { position: absolute; inset: 0; pointer-events: none; }
    .sky { background-image: radial-gradient(circle, rgba(27,36,81,.28) 0 1px, transparent 1.6px), radial-gradient(circle, rgba(184,60,91,.22) 0 1.2px, transparent 1.8px); background-size: 89px 89px, 137px 137px; background-position: 7px 18px, 51px 73px; opacity: .32; }
    .sky::before { content: ""; background: linear-gradient(112deg, transparent 40%, rgba(162,112,56,.14) 40.2%, transparent 41%); opacity: .55; }
    .sky::after { content: ""; background: radial-gradient(ellipse at 50% 110%, rgba(168,94,60,.12), transparent 58%); }
    main { min-height: 100vh; display: grid; place-items: center; padding: 28px; position: relative; }
    .scene { width: min(100%, 760px); min-height: 570px; display: grid; place-items: center; perspective: 1400px; }
    .envelope { width: min(100%, 650px); height: 425px; position: relative; filter: drop-shadow(0 26px 26px rgba(0,0,0,.32)); cursor: pointer; transform-style: preserve-3d; }
    .envelope-base { position: absolute; inset: 108px 0 0; background: #e7d4aa; border: 1px solid rgba(102,72,45,.27); overflow: hidden; }
    .envelope-base::before, .envelope-base::after { content: ""; position: absolute; width: 78%; height: 140%; top: -28%; background: #f1e0bb; transform-origin: bottom; }
    .envelope-base::before { left: -28%; transform: rotate(-31deg); border-right: 1px solid rgba(102,72,45,.18); }
    .envelope-base::after { right: -28%; transform: rotate(31deg); border-left: 1px solid rgba(102,72,45,.18); }
    .flap { position: absolute; z-index: 4; left: 0; top: 0; width: 0; height: 0; border-left: 325px solid transparent; border-right: 325px solid transparent; border-top: 216px solid #f5e4be; transform-origin: top; transition: transform 1s cubic-bezier(.23,.8,.32,1), z-index 0s .45s; backface-visibility: hidden; }
    .flap::after { content: ""; position: absolute; left: -325px; top: -216px; width: 650px; height: 216px; background: linear-gradient(137deg, transparent 49.6%, rgba(147,111,64,.13) 50%, transparent 50.3%); }
    .letter { width: 88%; height: 390px; position: absolute; z-index: 2; left: 6%; bottom: 34px; padding: 58px 65px 38px; text-align: center; background: var(--paper); border: 1px solid #e8d7af; box-shadow: 0 5px 17px rgba(44,35,24,.16); transition: transform 1s cubic-bezier(.23,.8,.32,1) .18s; }
    .letter::before { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(184,60,91,.28); pointer-events: none; }
    .letter h1 { position: relative; z-index: 1; margin: 0; color: var(--rose); font-family: "Ma Shan Zheng", cursive; font-size: clamp(42px, 7vw, 67px); font-weight: 400; line-height: 1.1; }
    .letter .for { position: relative; z-index: 1; margin: 10px 0 24px; font-size: 14px; letter-spacing: .22em; color: var(--muted); }
    .letter p { position: relative; z-index: 1; margin: 0 auto; max-width: 400px; font-size: clamp(16px, 2.3vw, 19px); line-height: 2; letter-spacing: .08em; }
    .letter .sign { position: relative; z-index: 1; margin-top: 23px; color: var(--rose); font-family: "Ma Shan Zheng", cursive; font-size: 29px; }
    .seal { position: absolute; z-index: 6; left: calc(50% - 36px); top: 175px; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 50%; color: #f4d995; background: radial-gradient(circle at 34% 28%, #d76376, var(--rose) 56%, #862844); border: 4px solid #a93350; box-shadow: inset 0 2px 3px rgba(255,255,255,.28), 0 4px 8px rgba(57,15,29,.25); transition: opacity .35s, transform .5s; }
    .seal svg { width: 30px; height: 30px; fill: currentColor; }
    .hint { position: absolute; z-index: 8; bottom: -40px; left: 0; right: 0; margin: 0; text-align: center; color: #6d4927; font-size: 14px; letter-spacing: .14em; animation: pulse 2.4s ease-in-out infinite; }
    .open .flap { z-index: 1; transform: rotateX(180deg); }
    .open .letter { transform: translateY(-148px); }
    .open .seal { opacity: 0; transform: scale(.7) rotate(20deg); pointer-events: none; }
    .open .hint { opacity: 0; }
    .close-button { position: absolute; z-index: 10; top: 18px; right: 18px; border: 1px solid rgba(109,73,39,.28); padding: 10px 15px; background: rgba(255,249,233,.66); color: #6d4927; font: inherit; font-size: 13px; letter-spacing: .08em; cursor: pointer; opacity: 0; transform: translateY(-5px); transition: .3s; }
    .open .close-button { opacity: 1; transform: translateY(0); }
    .confetti { position: fixed; z-index: 20; width: 8px; height: 13px; top: -20px; pointer-events: none; animation: fall var(--duration) linear forwards; }
    @keyframes pulse { 50% { opacity: .45; transform: translateY(3px); } }
    @keyframes fall { to { transform: translate3d(var(--drift), 108vh, 0) rotate(720deg); opacity: .1; } }
    @media (max-width: 680px) { main { padding: 14px; } .scene { min-height: 560px; } .envelope { transform: scale(.82); transform-origin: center; margin: -45px 0; } .letter { padding: 52px 42px 34px; } .close-button { top: 10px; right: 8px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="sky"></div>
  <main>
    <button class="close-button" id="closeButton" type="button">合上信笺</button>
    <section class="scene" aria-label="互动祝福贺卡">
      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="打开祝福信笺">
        <div class="letter">
          <h1>愿你被世界温柔以待</h1>
          <p class="for">TO · 最特别的你</p>
          <p>愿新一岁的日子，有花可赏，有人可念；<br>有奔赴山海的勇气，也有停下来感受幸福的从容。</p>
          <p class="sign">所有美好，都在路上</p>
        </div>
        <div class="envelope-base"></div>
        <div class="flap"></div>
        <div class="seal" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21.3 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.04 6.04 0 0 1 16.5 3C19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.51L12 21.3Z"></path></svg></div>
        <p class="hint">轻触蜡封，开启这封小小的祝福</p>
      </div>
    </section>
  </main>
  <script>
    const envelope = document.getElementById("envelope");
    const closeButton = document.getElementById("closeButton");
    function celebrate() {
      const shades = ["#d9ac51", "#f3df9f", "#b83c5b", "#e7d4aa", "#8ca2d6"];
      for (let i = 0; i < 48; i += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.backgroundColor = shades[i % shades.length];
        piece.style.setProperty("--duration", `${2.4 + Math.random() * 2.2}s`);
        piece.style.setProperty("--drift", `${-160 + Math.random() * 320}px`);
        document.body.appendChild(piece);
        window.setTimeout(() => piece.remove(), 5000);
      }
    }
    function openCard() { if (!envelope.classList.contains("open")) { envelope.classList.add("open"); envelope.setAttribute("aria-label", "祝福信笺已打开"); celebrate(); } }
    function closeCard() { envelope.classList.remove("open"); envelope.setAttribute("aria-label", "打开祝福信笺"); }
    envelope.addEventListener("click", openCard);
    envelope.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); openCard(); } });
    closeButton.addEventListener("click", (event) => { event.stopPropagation(); closeCard(); });
  </script>
</body>
</html>
